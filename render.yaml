# Render Blueprint: creates the Django API and a PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: jobpilot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: jobpilot-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false   # e.g. https://<your-app>.vercel.app,https://jobpilot-api.onrender.com
      - key: GEMINI_API_KEY
        sync: false   # paste in the Render dashboard, never in git
      - key: TAVILY_API_KEY
        sync: false   # real interview-experience posts on Company insights (optional)
      - key: ANTHROPIC_API_KEY
        sync: false

databases:
  - name: jobpilot-db
    plan: free
    databaseName: jobpilot
    user: jobpilot
